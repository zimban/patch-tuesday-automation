name: Patch Tuesday Automation

on:
  schedule:
    # Runs daily at 10:00 UTC (12:00 EET)
    - cron: "0 10 * * *"
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  windows-ticket:
    name: Windows Patch Tuesday Ticket
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Windows ticket script
        working-directory: scripts
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python windows_ticket.py

      - name: Commit updated state
        run: |
          git config user.name "patch-tuesday-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state after Windows ticket"
          git push

  macos-ticket:
    name: macOS Target Versions Ticket
    runs-on: ubuntu-latest
    needs: windows-ticket  # Run sequentially to avoid state.json conflicts
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Pick up any state.json commit from windows job

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run macOS ticket script
        working-directory: scripts
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python macos_ticket.py

      - name: Commit updated state
        run: |
          git config user.name "patch-tuesday-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state after macOS ticket"
          git push
